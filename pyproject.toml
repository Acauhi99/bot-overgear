[project]
name = "bot-overgear"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Acauhi99", email = "acauhi.mateus@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.2",
    "telethon>=1.43.2",
]

[project.scripts]
bot-overgear = "bot_overgear:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
